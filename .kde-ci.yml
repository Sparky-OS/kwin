Dependencies:
 - 'on': ['@all']
   'require':
    'frameworks/breeze-icons': '@latest-kf6'
    'frameworks/extra-cmake-modules': '@latest-kf6'
    'frameworks/kcmutils': '@latest-kf6'
    'frameworks/kconfig': '@latest-kf6'
    'frameworks/kcoreaddons': '@latest-kf6'
    'frameworks/kcrash': '@latest-kf6'
    'frameworks/kdeclarative': '@latest-kf6'
    'frameworks/kdoctools': '@latest-kf6'
    'frameworks/kglobalaccel': '@latest-kf6'
    'frameworks/ki18n': '@latest-kf6'
    'frameworks/kidletime': '@latest-kf6'
    'frameworks/knewstuff': '@latest-kf6'
    'frameworks/knotifications': '@latest-kf6'
    'frameworks/kpackage': '@latest-kf6'
    'frameworks/kservice': '@latest-kf6'
    'frameworks/ksvg': '@latest-kf6'
    'frameworks/kwidgetsaddons': '@latest-kf6'
    'frameworks/kwindowsystem': '@latest-kf6'
    'frameworks/kxmlgui': '@latest-kf6'
    'frameworks/kcolorscheme': '@latest-kf6'
    'libraries/libqaccessibilityclient': '@latest-kf6'
    'libraries/plasma-wayland-protocols': '@latest-kf6'
    'plasma/plasma-activities': 'Plasma/6.7'
    'plasma/kdecoration': 'Plasma/6.7'
    'plasma/kglobalacceld': 'Plasma/6.7'
    'plasma/knighttime': 'Plasma/6.7'
    'plasma/kpipewire': 'Plasma/6.7'
    'plasma/kscreenlocker': 'Plasma/6.7'
    'plasma/kwayland': 'Plasma/6.7'
    'plasma/milou': 'Plasma/6.7'
    'third-party/wayland': '@latest'
    'third-party/wayland-protocols': '@latest'

RuntimeDependencies:
 - 'on': ['@all']
   'require':
    'frameworks/kirigami': '@latest-kf6'
    'plasma/aurorae': 'Plasma/6.7'
    'plasma/breeze': 'Plasma/6.7'
    'plasma/libplasma': 'Plasma/6.7'
    'plasma/plasma-workspace': 'Plasma/6.7' # kscreenlocker needs it

Options:
 ctest-arguments: '--repeat until-pass:3'
 per-test-timeout: 90
 require-passing-tests-on: ['Linux/Qt6']
 run-tests-on: ['Linux']
 tests-run-in-parallel: True
 use-ccache: True
 cppcheck-arguments: '--enable=warning,style,performance --library=kwin-cppcheck.xml --suppress-xml=cppcheck-suppressions.xml'
 cppcheck-ignore-files:
  - autotests
 run-qmllint: False # https://qt-project.atlassian.net/browse/QTBUG-145572
